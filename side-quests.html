<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="quests" data-root="">
  <div class="layout">
    <main class="main" id="main">
      <div class="stage-wrap" style="--sh:1306px">
        <div class="stage quests">

          <figure class="q q-poster"><img src="assets/quests/heckler.jpg" alt="Heckler poster with a stack of colourful blocks" width="266" height="354"></figure>

          <p class="q-cap" style="left:174px;top:813px">Album of weird sounds</p>

          <a class="q-frog" href="https://gd.games/instant-builds/b57704dd-fddb-4052-9150-03ed6a9b4f2b?authuser=0" target="_blank" rel="noopener" aria-label="Play Cross the pond (opens the game in a new tab)"><img src="assets/quests/frog.png" alt="Pixel-art frog" width="694" height="694"></a>
          <a class="q-cap q-link" href="https://gd.games/instant-builds/b57704dd-fddb-4052-9150-03ed6a9b4f2b?authuser=0" target="_blank" rel="noopener" style="left:191.5px;top:1135px;width:225px">Cross the pond<br>(game)</a>

          <!-- phone mock-up -->
          <a class="q-phone" href="https://www.birdsofparadyes.com/products/natural-brown-timeless-hair-tint" target="_blank" rel="noopener" aria-label="I once modelled for Paradyes — open the product page (opens in a new tab)">
            <i class="btn-hw" style="top:115.8px;height:26.432px"></i>
            <i class="btn-hw" style="top:161.74px;height:42.795px"></i>
            <i class="btn-hw" style="top:215.86px;height:42.795px"></i>
            <i class="bezel-outer"></i><i class="bezel-inner"></i>
            <div class="screen"><img src="assets/quests/paradyes.jpg" alt="" width="236" height="510"></div>
          </a>
          <a class="q-cap q-link" href="https://www.birdsofparadyes.com/products/natural-brown-timeless-hair-tint" target="_blank" rel="noopener" style="left:470px;top:613px;width:230px">I once modelled for Paradyes</a>

          <figure class="q q-brain"><img src="assets/quests/fried-brain.png" alt="Illustration of a person stirring a pot of brains" width="253" height="380"></figure>
          <p class="q-cap" style="left:763px;top:449px">I fried my brain </p>

          <div class="q-basket"><span></span><img src="assets/quests/basket.png" alt="A wooden basket with a handle" width="274" height="308"></div>
          <p class="q-cap" style="left:775.5px;top:829px">Baskets are my favourite</p>

          <figure class="q q-abstract"><img src="assets/quests/abstract.jpg" alt="Abstract painting in blues and oranges" width="256" height="222"></figure>
          <p class="q-cap" style="left:463.5px;top:920px;width:251px">Abstract paintings?</p>

          <div class="shadow-fixed" style="filter:drop-shadow(-8px 4px 4px rgba(0,0,0,.39))">
            <div class="rc q-sword" style="--cx:983.7;--cy:511.65;--w:931;--h:206;--r:89.91deg"><img src="assets/quests/sword.png" alt="A wooden sword with a carved hilt" width="931" height="206"></div>
          </div>
          <p class="q-cap" style="left:984px;top:988px;width:128px">Sword(?)</p>

          <div class="q-camera"><img src="assets/quests/camera.png" alt="A yellow camera" width="435" height="724"></div>
          <p class="q-cap" style="left:531.5px;top:1233px">Clicking pictures in VR</p>

          <span class="q-patch-wrap">
            <button class="q-patch" type="button" aria-describedby="patchNote" aria-expanded="false"><img src="assets/quests/effort-patch.png" alt="An embroidered patch that says: An effort was made" width="169" height="200"></button>
            <span class="q-patch-note" id="patchNote" role="status" hidden>This is a pat on my back for finishing my portfolio – lol</span>
          </span>

          <img class="q-cat" src="assets/quests/el-gatto.svg" alt="El Gatto, a black cat sitting in a cooking pot" width="309" height="251">
          <p class="q-cap" style="left:867px;top:1260px">El Gatto</p>
