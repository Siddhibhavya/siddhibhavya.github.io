<body class="landing" data-page="landing" data-shell="none">
  <!-- koi-fish background (js/koi.js) on the Figma plum #190523 -->
  <div class="koi" id="koi" aria-hidden="true"></div>

  <main class="intro">
    <div class="intro-stage">
      <!-- orbit ring: Figma "Ellipse 1", rotated −20.59° about its centre -->
      <div class="orbit-rot" aria-hidden="true">
        <img class="orbit-img" src="assets/landing/orbit.svg" alt="" width="772.28" height="269.078">
      </div>

      <!-- stars 1, 2a, 2b sit on the ring and orbit it; 4 and 2c are free-floating -->
      <img class="star" data-orbit src="assets/landing/star-1.svg" alt="" style="--cx:374.37;--cy:683.43;--w:101;--h:94;--rot:21.87deg">
      <img class="star" data-orbit src="assets/landing/star-2.svg" alt="" style="--cx:1051.35;--cy:370.33;--w:66.156;--h:61.571;--rot:26.56deg">
      <img class="star" data-orbit src="assets/landing/star-2.svg" alt="" style="--cx:860.35;--cy:619.33;--w:66.156;--h:61.571;--rot:26.56deg">
      <img class="star twinkle" src="assets/landing/star-4.svg" alt="" style="--cx:1105.96;--cy:619;--w:66.156;--h:61.571;--rot:-7.82deg">
      <img class="star twinkle t2" src="assets/landing/star-2.svg" alt="" style="--cx:331.35;--cy:285.33;--w:66.156;--h:61.571;--rot:26.56deg">

      <img class="wordmark" src="assets/landing/siddhi.svg" alt="SIDDHI" width="640" height="140">

      <p class="hello">Welcome to my <span class="script">museum</span></p>
      <p class="thisis">I am your host...</p>

      <a class="btn" style="top:783px" href="guest-book">Be my Guest</a>
      <a class="btn" style="top:876px" href="home">Skip Intro</a>
    </div>
  </main>

  <script>window.KOI_CONFIG = { mount: '#koi', bg: [25, 5, 35], hoverOnly: false };</script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script src="js/koi.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
