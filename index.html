<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siddhi's website</title>
  <!-- what a shared link shows in chats and social apps -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Siddhi's website">
  <meta property="og:title" content="Siddhi's website">
  <meta property="og:url" content="https://siddhibhavya.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Siddhi's website">
  <meta name="theme-color" content="#1b0b2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ancizar+Serif:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body class="landing" data-page="landing" data-shell="none">
  <!-- koi-fish background (js/koi.js) on the Figma plum #1b0b2e -->
  <div class="koi" id="koi" aria-hidden="true"></div>

  <main class="intro">
    <div class="intro-stage">
      <!-- orbit ring: Figma "Ellipse 1", rotated −20.59° about its centre -->
      <div class="orbit-rot" aria-hidden="true">
        <img class="orbit-img" src="assets/landing/orbit.svg" alt="" width="686.92" height="230.116">
      </div>

      <!-- stars 1, 2a, 2b sit on the ring and orbit it; 4 and 2c are free-floating -->
      <img class="star" data-orbit src="assets/landing/star-1.svg" alt="" style="--cx:404.37;--cy:629.43;--w:101;--h:94;--rot:21.87deg">
      <img class="star" data-orbit src="assets/landing/star-2.svg" alt="" style="--cx:1011.35;--cy:360.33;--w:66.156;--h:61.571;--rot:26.56deg">
      <img class="star" data-orbit src="assets/landing/star-2.svg" alt="" style="--cx:780.35;--cy:579.33;--w:66.156;--h:61.571;--rot:26.56deg">
      <img class="star twinkle" src="assets/landing/star-4.svg" alt="" style="--cx:1105.96;--cy:619;--w:66.156;--h:61.571;--rot:-7.82deg">
      <img class="star twinkle t2" src="assets/landing/star-2.svg" alt="" style="--cx:331.35;--cy:285.33;--w:66.156;--h:61.571;--rot:26.56deg">

      <img class="wordmark" src="assets/landing/siddhi.svg" alt="SIDDHI" width="640" height="140">

      <!-- Figma "Board to the creative archives of" (477:12): Ancizar Sans Medium Italic 40px, then "of" in Blank Script 64px; the pointer scatters the letters (js/landing.js) -->
      <div class="archives">
        <p class="scatter archives-line">Board to the creative archives</p>
        <p class="scatter archives-of">of</p>
      </div>

      <!-- the two tickets (Figma 477:200 / 477:201): they straighten on hover -->
      <div class="tickets">
        <a class="ticket ticket-guest" href="guest-book" aria-label="Be my Guest"><span class="tk"><img src="assets/landing/ticket-guest.svg" alt="" width="190" height="84"><i class="tk-star" aria-hidden="true"></i></span></a>
        <a class="ticket ticket-site" href="home" aria-label="To the site"><span class="tk"><img src="assets/landing/ticket-site.svg" alt="" width="189.45" height="69.597"><i class="tk-star" aria-hidden="true"></i></span></a>
      </div>
    </div>
  </main>

  <script>window.KOI_CONFIG = { mount: '#koi', bg: [25, 5, 35], hoverOnly: false };</script>
  <script src="assets/vendor/p5.min.js" defer></script>
  <script src="js/koi.js" defer></script>
  <script src="js/landing.js"></script>
</body>
</html>
