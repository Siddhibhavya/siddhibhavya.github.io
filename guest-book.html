          <h1 class="gb-title">Welcome Aboard</h1>
          <p class="gb-sub">Draw yourself a little <span class="hl">drawing</span>! Exhibit in my <span class="hl">guest gallery</span>!</p>

          <div class="gb-card" id="gbCard">
            <div class="gb-paper"><canvas id="pad" aria-label="Drawing pad — draw with your mouse, finger or pen"></canvas></div>
            <div class="gb-tools" role="group" aria-label="Pen colour and size">
              <button class="gb-pen is-on" type="button" data-c="#0e0314" style="--c:#0e0314" aria-label="Black pen" aria-pressed="true"></button>
              <button class="gb-pen" type="button" data-c="#7f404e" style="--c:#7f404e" aria-label="Maroon pen" aria-pressed="false"></button>
              <button class="gb-pen" type="button" data-c="#bb3739" style="--c:#bb3739" aria-label="Red pen" aria-pressed="false"></button>
              <button class="gb-pen" type="button" data-c="#ff9a00" style="--c:#ff9a00" aria-label="Orange pen" aria-pressed="false"></button>
              <button class="gb-pen" type="button" data-c="#f2c230" style="--c:#f2c230" aria-label="Yellow pen" aria-pressed="false"></button>
              <button class="gb-pen" type="button" data-c="#249343" style="--c:#249343" aria-label="Green pen" aria-pressed="false"></button>
              <button class="gb-pen" type="button" data-c="#2c2696" style="--c:#2c2696" aria-label="Blue pen" aria-pressed="false"></button>
              <button class="gb-pen gb-eraser" type="button" data-c="erase" aria-label="Eraser" aria-pressed="false" title="Eraser"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 13.2 10.6 3.8a1.6 1.6 0 0 1 2.3-.2l3.5 2.9a1.6 1.6 0 0 1 .2 2.3L10 17H6.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 10.5l5 4.2M9.5 17H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
              <i class="gb-sep"></i>
              <div class="gb-sizes">
                <button class="gb-size" type="button" data-w="2" aria-label="Thin pen" aria-pressed="false"><i style="--d:4px"></i></button>
                <button class="gb-size is-on" type="button" data-w="4" aria-label="Medium pen" aria-pressed="true"><i style="--d:8px"></i></button>
                <button class="gb-size" type="button" data-w="9" aria-label="Thick pen" aria-pressed="false"><i style="--d:14px"></i></button>
              </div>
            </div>
          </div>

          <label class="gb-siglabel gb-ctl" for="sig">Signature</label>
          <input class="gb-sig gb-ctl" id="sig" type="text" aria-label="Signature — type it on the line" maxlength="28" autocomplete="off" spellcheck="false">
          <img class="gb-line gb-ctl" src="assets/guest/signature-line.svg" alt="" width="622" height="2">

          <span class="gb-colorlabel gb-ctl">Card colour</span>
          <div class="gb-swatches gb-ctl" role="radiogroup" aria-label="Card colour">
            <button class="gb-swatch" role="radio" aria-checked="true"  data-color="red"    style="left:596px;background:#bb3739" aria-label="Red"></button>
            <button class="gb-swatch" role="radio" aria-checked="false" data-color="orange" style="left:704px;background:#ff9a00" aria-label="Orange"></button>
            <button class="gb-swatch" role="radio" aria-checked="false" data-color="green"  style="left:812px;background:#249343" aria-label="Green"></button>
            <button class="gb-swatch" role="radio" aria-checked="false" data-color="blue"   style="left:920px;background:#2c2696" aria-label="Blue"></button>
          </div>

          <button class="gb-create gb-ctl" id="create" type="button">Create</button>
          <p class="gb-hint gb-ctl" id="hint" role="status"></p>
          <a class="gb-skip gb-ctl" id="skip" href="home">Go to main site</a>
